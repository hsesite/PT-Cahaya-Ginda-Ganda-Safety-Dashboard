<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Checklist Inspeksi - CGG Command Center</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Inter,sans-serif;
}

body{
background:#09111D;
color:white;
padding:24px;
}

.container{
max-width:1000px;
margin:auto;
}

.header{
margin-bottom:24px;
}

.header h1{
font-size:34px;
font-weight:800;
}

.header p{
opacity:.7;
margin-top:8px;
}

.card{
background:#111C2B;
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:24px;
margin-bottom:22px;
}

.badge{
display:inline-block;
background:#1E3A8A;
padding:6px 12px;
border-radius:999px;
font-size:13px;
margin-top:10px;
}

.launcher{
display:flex;
flex-direction:column;
gap:18px;
}

.launch-card{
background:#162233;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:22px;
cursor:pointer;
transition:.2s;
}

.launch-card:hover{
border-color:#2dd4bf;
transform:translateY(-2px);
}

.launch-title{
font-size:22px;
font-weight:700;
}

.launch-count{
margin-top:8px;
opacity:.7;
}

.variant-list{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:14px;
}

.variant{
background:#1F3B68;
padding:7px 14px;
border-radius:999px;
font-size:13px;
}

.back{
margin-bottom:18px;
background:#1F3B68;
border:none;
color:white;
padding:10px 18px;
border-radius:12px;
cursor:pointer;
}

.form-card{
background:#111C2B;
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:22px;
margin-bottom:20px;
}

.form-card h3{
font-size:22px;
margin-bottom:8px;
}

.meta{
opacity:.75;
margin-bottom:18px;
line-height:1.6;
}

.open{
display:inline-block;
margin-top:12px;
background:#16A34A;
color:white;
text-decoration:none;
padding:12px 22px;
border-radius:12px;
font-weight:700;
}

.empty{
opacity:.6;
text-align:center;
padding:30px;
}

.loading{
text-align:center;
opacity:.7;
padding:30px;
}

@media(max-width:640px){

.header h1{
font-size:28px;
}

.launch-title{
font-size:19px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>Checklist Inspeksi</h1>

<p>CGG Command Center HSE</p>

</div>

<div class="card">

<h2>Smart Launcher</h2>

<p style="margin-top:8px;opacity:.75;">
Pilih kategori inspeksi. Semua data diambil otomatis dari Publish Engine.
</p>

</div>

<div id="launcher" class="launcher">

<div class="loading">
Memuat daftar inspeksi...
</div>

</div>

<div id="inspectionApp" style="display:none;"></div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbz0DS2wr6spCCt2q6qT4zPjUCahOOFSbnC9BiN0AlNWM3JdnYeVwDq6u2Rrfx9bUou2/exec?action=forms";

let registry={};

async function loadLauncher(){

const launcher=document.getElementById("launcher");

launcher.innerHTML="<div class='loading'>Memuat...</div>";

try{

const res=await fetch(API);

registry=await res.json();

const groups={};

registry.forms.forEach(form=>{

if(!groups[form.category])
groups[form.category]=[];

groups[form.category].push(form);

});

launcher.innerHTML="";

Object.keys(groups).sort().forEach(category=>{

const forms=groups[category];

const variants=[
...new Set(
forms.flatMap(f=>f.variants||[f.subCategory])
)
];

launcher.innerHTML+=`

<div class="launch-card" onclick="openCategory('${category}')">

<div class="launch-title">
${icon(category)} ${category}
</div>

<div class="launch-count">
${forms.length} Form
</div>

<div class="variant-list">

${variants.map(v=>`<span class="variant">${v}</span>`).join("")}

</div>

</div>

`;

});

}catch(err){

console.error(err);

launcher.innerHTML=`
<div class="empty">
Gagal mengambil data Publish Engine.
</div>`;

}

}

function icon(cat){

switch(cat){

case"Unit":return"🚙";
case"Pit":return"⛏️";
case"Workshop":return"🔧";
case"APAR":return"🧯";
case"Office":return"🏢";
default:return"📋";

}

}

function openCategory(category){

const app=document.getElementById("inspectionApp");

const launcher=document.getElementById("launcher");

launcher.style.display="none";

app.style.display="block";

const forms=registry.forms.filter(f=>f.category===category);

app.innerHTML=`

<button class="back" onclick="backLauncher()">
← Kembali
</button>

<div class="card">

<h2>${icon(category)} ${category}</h2>

<p style="margin-top:8px;opacity:.75;">
${forms.length} Form tersedia
</p>

</div>

`;

forms.forEach(form=>{

const variants=(form.variants||[form.subCategory]).join(", ");

app.innerHTML+=`

<div class="form-card">

<h3>${form.title}</h3>

<div class="meta">

<b>Form :</b> ${form.formId}<br>

<b>Revisi :</b> ${form.revision}<br>

<b>Status :</b> ${form.status}<br>

<b>Item :</b> ${form.totalItems}<br>

<b>Variant :</b> ${variants}

</div>

<a href="${form.url}" target="_blank" class="open">

Buka Form

</a>

</div>

`;

});

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function backLauncher(){

document.getElementById("inspectionApp").style.display="none";

document.getElementById("launcher").style.display="flex";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

loadLauncher();

</script>

</body>
</html>
