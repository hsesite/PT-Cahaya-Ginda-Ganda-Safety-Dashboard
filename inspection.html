<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist Inspeksi - CGG</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#020d1f;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  padding:32px;
}
h1{font-size:48px;margin-bottom:8px}
.sub{color:#b8c3d8;margin-bottom:36px}
.card{
  background:#0b1830;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:28px;
  margin-bottom:24px;
}
.group-title{
  font-size:34px;
  font-weight:700;
  margin-bottom:8px;
}
.form-card{
  background:#13233f;
  border-radius:22px;
  padding:24px;
  margin-top:18px;
}
.form-card h3{
  font-size:24px;
  margin-bottom:16px;
}
.meta{
  color:#c4cfde;
  line-height:1.8;
}
.btn{
  display:inline-block;
  margin-top:22px;
  background:#1db954;
  color:#fff;
  padding:14px 28px;
  border-radius:14px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  font-weight:700;
}
.tag{
  display:inline-block;
  background:#204b96;
  padding:8px 14px;
  border-radius:999px;
  margin-right:8px;
  margin-top:12px;
}
</style>
</head>

<body>

<h1>Checklist Inspeksi</h1>
<div class="sub">CGG Command Center HSE</div>

<div class="card">
  <div class="group-title">Smart Launcher</div>
  <div class="sub">Pilih kategori inspeksi. Semua data diambil otomatis dari Publish Engine.</div>
</div>

<div id="launcher"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbz0DS2wr6spCCt2q6qT4zPjUCahOOFSbnC9BiN0AlNWM3JdnYeVwDq6u2Rrfx9bUou2/exec?action=forms";

async function loadLauncher(){

  try{

    const res=await fetch(API);
    const data=await res.json();

    const forms=data.forms||[];
    const groups={};

    forms.forEach(f=>{
      const key=f.category||"Lainnya";
      if(!groups[key]) groups[key]=[];
      groups[key].push(f);
    });

    const wrap=document.getElementById("launcher");
    wrap.innerHTML="";

    Object.keys(groups).forEach(category=>{

      const list=groups[category];

      const card=document.createElement("div");
      card.className="card";

      card.innerHTML=`
        <div class="group-title">📂 ${category}</div>
        <div class="sub">${list.length} Form</div>
      `;

      list.forEach(f=>{

        const item=document.createElement("div");
        item.className="form-card";

        item.innerHTML=`
          <h3>${f.title}</h3>

          <div class="meta">
            <div><b>Form ID :</b> ${f.formId}</div>
            <div><b>Revisi :</b> ${f.revision}</div>
            <div><b>Status :</b> ${f.status}</div>
            <div><b>Total Item :</b> ${f.totalItems}</div>
            <div><b>Variant :</b> ${(f.variants||[]).join(", ")||"-"}</div>

            <div>
              ${(f.keywords||[]).map(k=>`<span class="tag">${k}</span>`).join("")}
            </div>
          </div>

          <button class="btn"
            onclick="location.href='form.html?id='+encodeURIComponent('${f.formId}')">
            Mulai Inspeksi
          </button>
        `;

        card.appendChild(item);

      });

      wrap.appendChild(card);

    });

  }catch(err){

    console.error(err);

    document.getElementById("launcher").innerHTML=`
      <div class="card">
        <h2>❌ Gagal memuat Smart Launcher</h2>
        <p>${err.message}</p>
      </div>
    `;

  }

}

loadLauncher();
</script>

</body>
</html>
