<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Inspection Smart Launcher v2</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#09111D;
color:white;
padding:24px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
margin-bottom:28px;
}

.header h1{
font-size:40px;
font-weight:800;
}

.header p{
margin-top:8px;
opacity:.7;
}

.card{
background:#111C2B;
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:24px;
margin-bottom:22px;
}

.back{
background:#1F3B68;
border:none;
color:white;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
margin-bottom:18px;
font-weight:600;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:18px;
}

.item{
background:#162233;
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:22px;
cursor:pointer;
transition:.25s;
}

.item:hover{
border-color:#22C55E;
transform:translateY(-4px);
}

.item h3{
font-size:22px;
margin-bottom:8px;
}

.item p{
opacity:.7;
}

.badges{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:14px;
}

.badge{
background:#1F3B68;
padding:6px 12px;
border-radius:999px;
font-size:12px;
}

.form-card{
background:#162233;
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:24px;
margin-bottom:20px;
}

.form-card h3{
font-size:24px;
margin-bottom:12px;
}

.meta{
line-height:1.8;
opacity:.78;
margin-bottom:20px;
}

.btn{
display:inline-block;
background:#16A34A;
padding:13px 24px;
border-radius:12px;
text-decoration:none;
color:white;
font-weight:700;
}

.loading{
text-align:center;
padding:50px;
opacity:.7;
}

@media(max-width:640px){

.header h1{
font-size:32px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>Checklist Inspeksi</h1>

<p>CGG Command Center HSE</p>

</div>

<div id="app">

<div class="loading">

Memuat Smart Launcher...

</div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbz0DS2wr6spCCt2q6qT4zPjUCahOOFSbnC9BiN0AlNWM3JdnYeVwDq6u2Rrfx9bUou2/exec?action=forms";

let registry={};

let currentCategory=null;
let currentSubCategory=null;

const icons={

"Unit":"🚙",

"Area Operasional":"⛏️",

"Pit":"⛏️",

"Workshop":"🔧",

"Safety Device":"🦺",

"Building & Office":"🏢",

"Office":"🏢",

"MHR":"🏭",

"Camp & Facility":"🏭"

};

async function init(){

const res=await fetch(API);

registry=await res.json();

renderCategories();

}

function renderCategories(){

const app=document.getElementById("app");

const groups={};

registry.forms.forEach(f=>{

const cat=f.category||"Lainnya";

(groups[cat]??=[]).push(f);

});

app.innerHTML=`

<div class="card">

<h2>Smart Launcher</h2>

<p style="margin-top:10px;opacity:.75;">
Pilih area inspeksi. Semua kategori dibuat otomatis dari Publish Engine.
</p>

</div>

<div class="grid" id="catGrid"></div>

`;

const grid=document.getElementById("catGrid");

Object.keys(groups).sort().forEach(cat=>{

grid.innerHTML+=`

<div class="item" onclick="renderSub('${cat}')">

<h3>${icons[cat]||"📋"} ${cat}</h3>

<p>${groups[cat].length} Form</p>

</div>

`;

});

}

function renderSub(cat){

currentCategory=cat;

const forms=registry.forms.filter(f=>(f.category||"Lainnya")===cat);

const subs={};

forms.forEach(f=>{

const sub=f.subCategory||"Umum";

(subs[sub]??=[]).push(f);

});

const app=document.getElementById("app");

app.innerHTML=`

<button class="back" onclick="renderCategories()">
← Kembali
</button>

<div class="card">

<h2>${icons[cat]||"📋"} ${cat}</h2>

<p style="margin-top:8px;opacity:.7;">
Pilih jenis inspeksi.
</p>

</div>

<div class="grid" id="subGrid"></div>

`;

const grid=document.getElementById("subGrid");

Object.keys(subs).sort().forEach(sub=>{

const variants=[

...new Set(

subs[sub].flatMap(f=>f.variants||[])

)

];

grid.innerHTML+=`

<div class="item" onclick="renderForms('${sub}')">

<h3>${sub}</h3>

<p>${subs[sub].length} Form</p>

<div class="badges">

${variants.map(v=>`<span class="badge">${v}</span>`).join("")}

</div>

</div>

`;

});

}

function renderForms(sub){

currentSubCategory=sub;

const forms=registry.forms.filter(f=>

(f.category||"Lainnya")===currentCategory &&

(f.subCategory||"Umum")===sub

);

const app=document.getElementById("app");

app.innerHTML=`

<button class="back" onclick="renderSub('${currentCategory}')">
← Kembali
</button>

<div class="card">

<h2>${icons[currentCategory]||"📋"} ${currentCategory}</h2>

<p style="margin-top:8px;opacity:.7;">
${sub}
</p>

</div>

`;

forms.forEach(f=>{

app.innerHTML+=`

<div class="form-card">

<h3>${f.title}</h3>

<div class="meta">

<b>Form ID :</b> ${f.formId}<br>

<b>Revisi :</b> ${f.revision||"-"}<br>

<b>Status :</b> ${f.status}<br>

<b>Total Item :</b> ${f.totalItems}<br>

<b>Variant :</b> ${(f.variants||[]).join(", ")||"-"}

</div>

<a class="btn" href="form.html?id=${encodeURIComponent(f.formId)}">
  Mulai Inspeksi
</a>

</div>

`;

});

}

init().catch(err=>{

document.getElementById("app").innerHTML=`

<div class="card">

<h2>Gagal memuat Smart Launcher</h2>

<p style="margin-top:10px;opacity:.75;">
${err.message}
</p>

</div>

`;

console.error(err);

});

</script>

</body>
</html>
