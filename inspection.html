<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist Inspeksi</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Inter,sans-serif;
background:#0D1117;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:24px;
}

.header{
background:#161B22;
padding:24px;
border-radius:18px;
margin-bottom:20px;
border:1px solid #30363D;
}

.header h1{
margin:0;
font-size:28px;
}

.meta{
color:#9CA3AF;
margin-top:8px;
}

.item{
background:#161B22;
border:1px solid #30363D;
border-radius:14px;
padding:18px;
margin-bottom:12px;
}

.item h3{
margin:0 0 10px;
font-size:18px;
}

.kode{
display:inline-block;
background:#1F2937;
padding:4px 10px;
border-radius:20px;
font-size:12px;
margin-bottom:12px;
}

.actions{
display:flex;
gap:10px;
margin-top:14px;
}

.actions button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
font-size:15px;
}

.btn-ya{
background:#16A34A;
color:white;
}

.btn-tidak{
background:#DC2626;
color:white;
}

.btn-selected{
outline:3px solid white;
}

footer{
margin:30px 0;
text-align:center;
color:#6B7280;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1 id="judul">Memuat...</h1>

<div class="meta">

<div id="formid"></div>

<div id="revisi"></div>

<div id="total"></div>

</div>

</div>

<div id="items"></div>

<footer>

CGG Safety Inspection

</footer>

</div>

<script src="js/api.js"></script>
<script src="js/inspection.js"></script>

</body>
</html>
