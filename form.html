<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Form Inspeksi CGG</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#09111D;
color:white;
padding:24px;
}

.container{
max-width:1000px;
margin:auto;
}

.card{
background:#111C2B;
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:24px;
margin-bottom:20px;
}

.title{
font-size:34px;
font-weight:800;
margin-bottom:8px;
}

.subtitle{
opacity:.7;
margin-bottom:20px;
}

.back{
display:inline-block;
margin-bottom:20px;
background:#1F3B68;
padding:10px 18px;
border-radius:10px;
color:white;
text-decoration:none;
}

.info-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px;
margin-top:20px;
}

.info-item{
background:#162233;
padding:16px;
border-radius:14px;
}

.info-item b{
display:block;
margin-bottom:6px;
font-size:14px;
opacity:.7;
}

.section{
font-size:22px;
font-weight:700;
margin:30px 0 15px;
}

.item{
background:#162233;
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:20px;
margin-bottom:18px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}

.no{
width:44px;
height:44px;
background:#2563EB;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.kode{
background:#26364F;
padding:6px 12px;
border-radius:999px;
font-size:12px;
}

.question{
font-size:22px;
font-weight:700;
margin-bottom:20px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

button{
border:none;
padding:14px;
border-radius:12px;
font-weight:700;
font-size:17px;
cursor:pointer;
}

.yes{
background:#16A34A;
color:white;
}

.noBtn{
background:#DC2626;
color:white;
}

.selected{
outline:3px solid white;
}

.loading{
text-align:center;
padding:60px;
opacity:.7;
}

</style>
</head>

<body>

<div class="container">

<a class="back" href="inspection.html">← Kembali</a>

<div id="app">

<div class="loading">

Memuat form inspeksi...

</div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbz0DS2wr6spCCt2q6qT4zPjUCahOOFSbnC9BiN0AlNWM3JdnYeVwDq6u2Rrfx9bUou2/exec?action=forms";

const formId=new URLSearchParams(location.search).get("id");

let registry={};

let form={};

async function init(){

const res=await fetch(API);

registry=await res.json();

form=registry.forms.find(f=>f.formId===formId);

if(!form){

document.getElementById("app").innerHTML="<div class='card'><h2>Form tidak ditemukan</h2></div>";

return;

}

loadForm();

}

async function loadForm(){

const downloadUrl=`https://drive.google.com/uc?export=download&id=${form.fileId}`;

const res=await fetch(downloadUrl);

const data=await res.json();

render(data);

}
function render(data){

const app=document.getElementById("app");

app.innerHTML=`

<div class="card">

<div class="title">${data.title}</div>

<div class="subtitle">

${data.formId} · Revisi ${data.revision}

</div>

<div class="info-grid">

${data.context.map(c=>`

<div class="info-item">

<b>${c.label}</b>

${c.value||"-"}

</div>

`).join("")}

</div>

</div>

<h2 class="section">Checklist Pemeriksaan</h2>

`;

data.items.forEach((item,i)=>{

app.innerHTML+=`

<div class="item">

<div class="top">

<div class="no">${item.nomor}</div>

<div class="kode">${item.kode||"-"}</div>

</div>

<div class="question">

${item.poin}

</div>

<div class="actions">

<button class="yes"

onclick="choose(${i},'YA',this)">

YA

</button>

<button class="noBtn"

onclick="choose(${i},'TIDAK',this)">

TIDAK

</button>

</div>

</div>

`;

});

}

function choose(index,value,btn){

const box=btn.closest(".actions");

box.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));

btn.classList.add("selected");

}

init().catch(err=>{

document.getElementById("app").innerHTML=`

<div class="card">

<h2>Gagal memuat</h2>

<p>${err.message}</p>

</div>

`;

console.error(err);

});

</script>

</body>
</html>
