<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form Inspeksi</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#020d1f;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  padding:24px;
}
.card{
  background:#0b1830;
  border-radius:22px;
  padding:22px;
  margin-bottom:22px;
  border:1px solid rgba(255,255,255,.08);
}
.section{
  margin-top:30px;
}
.section h2{
  margin-bottom:16px;
}
.item{
  background:#13233f;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  border-radius:999px;
  background:#2453d4;
  font-weight:700;
  margin-bottom:14px;
}
.code{
  float:right;
  background:#31435f;
  padding:6px 10px;
  border-radius:999px;
}
.title{
  font-size:22px;
  font-weight:700;
  margin-bottom:16px;
}
.actions{
  display:flex;
  gap:14px;
}
button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
.yes{background:#16a34a}
.no{background:#dc2626}
.context{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}
.field{
  background:#13233f;
  padding:16px;
  border-radius:16px;
}
.field label{
  display:block;
  color:#b7c3d6;
  margin-bottom:6px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbz0DS2wr6spCCt2q6qT4zPjUCahOOFSbnC9BiN0AlNWM3JdnYeVwDq6u2Rrfx9bUou2/exec?action=forms";

async function loadForm(){

  try{

    const params=new URLSearchParams(location.search);
    const formId=params.get("id");

    if(!formId) throw new Error("Form ID tidak ditemukan.");

    const api=API.replace("action=forms","action=form");

    const res=await fetch(`${api}&id=${encodeURIComponent(formId)}`);

    if(!res.ok) throw new Error("API gagal diakses.");

    const data=await res.json();

    if(data.success===false) throw new Error(data.message);

    render(data);

  }catch(err){

    console.error(err);

    document.getElementById("app").innerHTML=`
      <div class="card">
        <h2>❌ Gagal memuat form</h2>
        <p>${err.message}</p>
      </div>
    `;

  }

}

function render(data){

  const app=document.getElementById("app");

  app.innerHTML=`
    <div class="card">
      <h1>${data.title}</h1>
      <div>Form ID : ${data.formId}</div>
      <div>Revisi : ${data.revision}</div>
      <div>Status : ${data.status}</div>
    </div>

    <div class="card">
      <h2>Informasi Pemeriksaan</h2>
      <div class="context">
        ${data.context.map(c=>`
          <div class="field">
            <label>${c.label}</label>
            <div>${c.value||"-"}</div>
          </div>
        `).join("")}
      </div>
    </div>

    ${data.sections.map(sec=>`
      <div class="section">
        <h2>${sec.title}</h2>

        ${sec.items.map(i=>`
          <div class="item">

            <div class="badge">${i.no}</div>

            <span class="code">${i.code}</span>

            <div class="title">${i.title}</div>

            <div class="actions">
              <button class="yes">YA</button>
              <button class="no">TIDAK</button>
            </div>

          </div>
        `).join("")}

      </div>
    `).join("")}
  `;

}

loadForm();
</script>

</body>
</html>
