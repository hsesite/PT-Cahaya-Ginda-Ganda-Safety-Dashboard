
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PT CAHAYA GINDA GANDA SAFETY DASHBOARD</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

:root{
--bg:#0F1115;
--surface:#181C23;
--card:#232833;
--border:#313845;
--text:#F5F7FA;
--muted:#AAB2C0;
--green:#00C853;
--yellow:#FFC107;
--red:#F44336;
--blue:#2196F3;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:var(--bg);
color:var(--text);
font-family:"Segoe UI",Arial,sans-serif;

}

/* HEADER */

.header{

padding:30px;
border-bottom:1px solid var(--border);

}

.logo{

font-size:34px;
font-weight:700;

}

.subtitle{

color:var(--muted);

}

.clock{

font-size:15px;
color:var(--muted);

}

/* KPI */

.kpi{

background:var(--surface);
border:1px solid var(--border);
border-radius:18px;
padding:20px;
transition:.3s;

}

.kpi:hover{

border-color:var(--green);

}

.kpi i{

font-size:28px;
margin-bottom:10px;

}

.kpi h5{

font-size:30px;

}

/* MENU */

.card-menu{

background:var(--surface);
border:1px solid var(--border);
border-radius:20px;
padding:30px 20px;
text-align:center;
transition:.25s;
cursor:pointer;
height:170px;
display:flex;
flex-direction:column;
justify-content:center;

}

.card-menu:hover{

transform:translateY(-8px);
border-color:var(--green);
box-shadow:0 12px 25px rgba(0,200,83,.18);

}

.card-menu i{

font-size:42px;
margin-bottom:18px;
color:var(--green);

}

.card-menu span{

font-size:20px;
font-weight:600;

}

/* FOOTER */

.footer{

margin-top:60px;
padding:25px;
border-top:1px solid var(--border);
text-align:center;
color:var(--muted);
font-size:14px;

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="container">

<div class="d-flex justify-content-between align-items-center flex-wrap">

<div>

<div class="logo">

<i class="fa-solid fa-helmet-safety"></i>

PT CAHAYA GINDA GANDA SAFETY DASHBOARD

</div>

<div class="subtitle">

Portal Digital HSE

</div>

</div>

<div class="clock" id="clock"></div>

</div>

</div>

</div>

<!-- CONTENT -->

<div class="container py-5">

<!-- KPI -->

<div class="row g-3 mb-5">

<div class="col-6 col-lg-3">

<div class="kpi">

<i class="fa-solid fa-triangle-exclamation text-warning"></i>

<p>Hazard Report</p>

<h5>0</h5>

</div>

</div>

<div class="col-6 col-lg-3">

<div class="kpi">

<i class="fa-solid fa-shield-halved text-info"></i>

<p>PTW AKTIF </p>

<h5>0</h5>

</div>

</div>

<div class="col-6 col-lg-3">

<div class="kpi">

<i class="fa-solid fa-clipboard-check text-success"></i>

<p>Inspeksi</p>

<h5>0</h5>

</div>

</div>

<div class="col-6 col-lg-3">

<div class="kpi">

<i class="fa-solid fa-chart-line text-danger"></i>

<p>Compliance</p>

<h5>100%</h5>

</div>

</div>

</div>

<!-- MENU -->

<div class="row g-4">

<div class="col-6 col-md-3">

<div class="card-menu" onclick="location.href='hazard/'">

<i class="fa-solid fa-triangle-exclamation"></i>

<span>Hazard Report</span>

</div>

</div>

<div class="col-6 col-md-3">

<div class="card-menu">

<i class="fa-solid fa-shield-halved"></i>

<span>PTW</span>

</div>

</div>

<div class="col-6 col-md-3">

<div class="card-menu">

<i class="fa-solid fa-clipboard-check"></i>

<span>Inspeksi</span>

</div>

</div>

<div class="col-6 col-md-3">

<div class="card-menu">

<i class="fa-solid fa-book"></i>

<span>SOP</span>

</div>

</div>

<div class="col-6 col-md-3">

<div class="card-menu">

<i class="fa-solid fa-leaf"></i>

<span>Environment</span>

</div>

</div>

<div class="col-6 col-md-3">

<div class="card-menu">

<i class="fa-solid fa-heart-pulse"></i>

<span>Paramedis</span>

</div>

</div>

<div class="col-6 col-md-3">

<div class="card-menu">

<i class="fa-solid fa-chart-column"></i>

<span>Dashboard</span>

</div>

</div>

<div class="col-6 col-md-3">

<div class="card-menu">

<i class="fa-solid fa-bell"></i>

<span>Emergency</span>

</div>

</div>

</div>

</div>
  
<!-- FOOTER -->

<div class="footer">

PT Cahaya Ginda Ganda

<br>

CGG Safety

</div>

<script>

function updateClock(){

const now=new Date();

document.getElementById("clock").innerHTML=

now.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+

"<br>"+

now.toLocaleTimeString("id-ID");

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>

</html>
