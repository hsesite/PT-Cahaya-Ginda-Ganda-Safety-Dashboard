
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>PT. CGG HSE Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/responsive.css">

<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="background-glow"></div>

<main class="app">

<header class="glass header">

<div class="brand">

<div class="logo-box">

<img src="assets/img/logo-cgg.png" alt="Logo CGG">

</div>

<div>

<h1>PT. CGG HSE Dashboard</h1>

</div>

</div>

<div class="status online" id="networkStatus">

<i data-lucide="wifi"></i>

<span>Online</span>

</div>

<div class="header-info">

<div class="info-card">

<i data-lucide="calendar-days"></i>

<span id="todayDate"></span>

</div>

<div class="info-card">

<i data-lucide="clock-3"></i>

<span id="liveClock"></span>

</div>

<div class="info-card">

<i data-lucide="sun" id="shiftIcon"></i>

<span id="shiftText"></span>

</div>

</div>

</header>

<section class="hero glass">

<div>

<p>Ringkasan Hari Ini</p>

<h2 id="inspectionCounter">0</h2>

</div>

<div class="hero-icon">

<i data-lucide="activity"></i>

</div>

</section>

<section class="quick-grid">

<div class="glass stat-card">

<p>Inspection</p>

<h3>0</h3>

</div>

<div class="glass stat-card">

<p>Hazard</p>

<h3>0</h3>

</div>

<div class="glass stat-card">

<p>Incident</p>

<h3>0</h3>

</div>

</section>

<section class="menu-grid">

<button class="glass menu-card">

<div class="icon-glass"><i data-lucide="clipboard-check"></i></div>

<span>Inspection</span>

</button>

<button class="glass menu-card">

<div class="icon-glass"><i data-lucide="triangle-alert"></i></div>

<span>Hazard</span>

</button>

<button class="glass menu-card">

<div class="icon-glass"><i data-lucide="circle-alert"></i></div>

<span>Incident</span>

</button>

<button class="glass menu-card">

<div class="icon-glass"><i data-lucide="leaf"></i></div>

<span>Environment</span>

</button>

<button class="glass menu-card">

<div class="icon-glass"><i data-lucide="heart-pulse"></i></div>

<span>Medical</span>

</button>

<button class="glass menu-card">

<div class="icon-glass"><i data-lucide="bar-chart-3"></i></div>

<span>Dashboard</span>

</button>

</section>

<section class="glass sync-card">

<div class="sync-left">

<i data-lucide="cloud-check"></i>

<div>

<h4>Status Sinkronisasi</h4>

<p>Semua data tersinkron</p>

</div>

</div>

<span class="badge">ONLINE</span>

</section>

<!-- ========================================
     APP VIEW (Router)
======================================== -->

<section id="appView" class="app-view">

<div class="view-placeholder">

<div class="placeholder-icon">
<i data-lucide="sparkles"></i>
</div>

<h3>Selamat Datang</h3>

<p>Pilih menu untuk memulai.</p>

</div>

</section>
  
<footer>

PT Cahaya Ginda Ganda • HSE Digital System

</footer>

</main>

<div id="pageTransition" class="page-transition"></div>
  
<script src="js/ui.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>

<script>

lucide.createIcons();

</script>

</body>
</html>
