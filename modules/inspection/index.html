<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGG Smart Inspection</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#0f172a;
color:#fff;
}

.header{
background:#dc2626;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.container{
max-width:420px;
margin:auto;
padding:15px;
}

.card{
background:#1e293b;
padding:16px;
border-radius:14px;
margin-bottom:16px;
}

label{
display:block;
margin-bottom:6px;
font-size:14px;
color:#cbd5e1;
}

input,select{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#334155;
color:white;
margin-bottom:12px;
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.btn-start{
width:100%;
padding:15px;
background:#16a34a;
border:none;
border-radius:12px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.btn-start:hover{
background:#15803d;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color:#94a3b8;
}
</style>

</head>

<body>

<div class="header">
CGG SMART INSPECTION
</div>

<div class="container">

<div class="card">

<label>Nama Inspector</label>
<input type="text" placeholder="Masukkan nama">

<div class="info">

<div>
<label>Shift</label>
<select>
<option>Day</option>
<option>Night</option>
</select>
</div>

<div>
<label>Area</label>
<select>
<option>Pilih Area</option>
<option>Pit Jaja</option>
<option>Pit Ranis</option>
<option>Pit Budi</option>
<option>Workshop SLS</option>
<option>Workshop VIP</option>
</select>
</div>

</div>

<label>Jenis Form</label>
<select>
<option>Inspeksi LV</option>
</select>

<button class="btn-start">
Mulai Inspeksi
</button>

</div>

<div class="footer">
CGG Safety Hub v1.0
</div>

</div>

<script src="app.js"></script>

</body>
</html>
