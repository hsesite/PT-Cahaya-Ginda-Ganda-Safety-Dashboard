<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Inspeksi</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

.header{
background:#dc2626;
padding:18px;
text-align:center;
font-weight:bold;
font-size:20px;
}

.container{
max-width:420px;
margin:auto;
padding:15px;
}

.card{
background:#1e293b;
border-radius:14px;
padding:16px;
margin-bottom:15px;
}

.item{
margin-bottom:18px;
padding-bottom:15px;
border-bottom:1px solid #334155;
}

.item:last-child{
border-bottom:none;
margin-bottom:0;
padding-bottom:0;
}

.nomor{
font-size:13px;
color:#94a3b8;
margin-bottom:4px;
}

.judul{
font-size:16px;
font-weight:bold;
margin-bottom:12px;
}

.opsi{
display:flex;
gap:10px;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.yes{
background:#16a34a;
color:white;
}

.no{
background:#dc2626;
color:white;
}
</style>

</head>

<body>

<div class="header">
INSPEKSI LV
</div>

<div class="container">

<div class="card">

<div class="item">
<div class="nomor">Poin 1</div>
<div class="judul">APAR tersedia</div>

<div class="opsi">
<button class="yes">YA</button>
<button class="no">TIDAK</button>
</div>
</div>

<div class="item">
<div class="nomor">Poin 2</div>
<div class="judul">Seatbelt berfungsi</div>

<div class="opsi">
<button class="yes">YA</button>
<button class="no">TIDAK</button>
</div>
</div>

<div class="item">
<div class="nomor">Poin 3</div>
<div class="judul">Klakson berfungsi</div>

<div class="opsi">
<button class="yes">YA</button>
<button class="no">TIDAK</button>
</div>
</div>

</div>

</div>

</body>
</html>
