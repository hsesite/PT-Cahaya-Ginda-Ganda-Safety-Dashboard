<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGG Safety Hub</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

.header{
background:#dc2626;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.container{
max-width:420px;
margin:auto;
padding:15px;
}

.card{
background:#1e293b;
border-radius:14px;
padding:16px;
margin-bottom:15px;
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-2px);
background:#26364d;
}

.id{
font-size:12px;
color:#94a3b8;
}

.nama{
font-size:17px;
font-weight:bold;
margin:6px 0;
}

.rev{
font-size:13px;
color:#cbd5e1;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color:#94a3b8;
}
</style>
</head>

<body>

<div class="header">
PILIH FORM INSPEKSI
</div>

<div class="container">

<div id="formList"></div>

<div class="footer">
CGG Safety Hub v1.0
</div>

</div>

<script>
const forms=[
{
formId:"017/Form-HSE-CGG/2025",
namaForm:"0.1 Form Pemeriksaan Sarana",
revisi:"Rev.1"
}
];

const container=document.getElementById("formList");

forms.forEach(form=>{

container.innerHTML+=`
<div class="card">
<div class="id">${form.formId}</div>
<div class="nama">${form.namaForm}</div>
<div class="rev">${form.revisi}</div>
</div>
`;

});
</script>

</body>
</html>
