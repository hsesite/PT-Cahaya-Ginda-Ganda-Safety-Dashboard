<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGG Safety Hub - Form Inspection</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071633;
color:white;
}

.header{
background:#E31E24;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
max-width:430px;
margin:auto;
padding:15px;
}

.card{
background:#16284B;
border-left:5px solid #2F80ED;
border-radius:14px;
padding:16px;
margin-bottom:15px;
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
background:#1D3561;
}

.formid{
font-size:12px;
color:#B8C7E0;
}

.nama{
font-size:17px;
font-weight:bold;
margin:8px 0;
}

.info{
display:flex;
justify-content:space-between;
font-size:12px;
color:#D7E3F5;
margin-top:10px;
}

.footer{
text-align:center;
color:#9DB0D3;
margin:25px 0;
font-size:12px;
}

.loading{
text-align:center;
padding:40px;
color:#9DB0D3;
}
</style>
</head>

<body>

<div class="header">
PILIH FORM INSPEKSI
</div>

<div class="container">

<div id="listForm" class="loading">
Memuat daftar form...
</div>

<div class="footer">
CGG Safety Hub v1.0
</div>

</div>

<script>

/* ===========================================================
   SEMENTARA PAKAI DATA LOKAL
   Setelah API selesai tinggal ganti 1 bagian saja.
=========================================================== */

const daftarForm=[

{
formId:"017/Form-HSE-CGG/2025",
namaForm:"0.1 Form Pemeriksaan Sarana",
revisi:"Rev.1",
status:"Aktif"
}

];

const list=document.getElementById("listForm");

function tampilkanForm(){

list.innerHTML="";

daftarForm.forEach(form=>{

list.innerHTML+=`

<div class="card" onclick="pilihForm('${form.formId}')">

<div class="formid">${form.formId}</div>

<div class="nama">${form.namaForm}</div>

<div class="info">

<span>📄 ${form.revisi}</span>

<span>🟢 ${form.status}</span>

</div>

</div>

`;

});

}

function pilihForm(formId){

window.location.href="checklist.html?form="+encodeURIComponent(formId);

}

tampilkanForm();

</script>

</body>
</html>
