<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGG Safety Hub - Pilih Form</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

.header{
background:#dc2626;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
position:sticky;
top:0;
}

.container{
max-width:430px;
margin:auto;
padding:15px;
}

.card{
background:#1e293b;
border-radius:14px;
padding:16px;
margin-bottom:15px;
cursor:pointer;
transition:.2s;
border-left:5px solid #2563eb;
}

.card:hover{
transform:translateY(-2px);
background:#26364d;
}

.id{
font-size:12px;
color:#94a3b8;
}

.nama{
font-size:17px;
font-weight:bold;
margin:8px 0;
}

.info{
display:flex;
justify-content:space-between;
font-size:12px;
color:#cbd5e1;
margin-top:8px;
}

.loading{
text-align:center;
padding:30px;
color:#94a3b8;
}

.error{
background:#7f1d1d;
padding:15px;
border-radius:10px;
text-align:center;
}

.footer{
text-align:center;
margin:20px 0;
font-size:12px;
color:#94a3b8;
}
</style>
</head>

<body>

<div class="header">
PILIH FORM INSPEKSI
</div>

<div class="container">

<div id="formList" class="loading">
Memuat daftar form...
</div>

<div class="footer">
CGG Safety Hub v1.0
</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbz0DS2wr6spCCt2q6qT4zPjUCahOOFSbnC9BiN0AlNWM3JdnYeVwDq6u2Rrfx9bUou2/exec";

async function loadForms(){

const container=document.getElementById("formList");

try{

const response = await fetch(API + "?action=forms");
const data=await response.json();

container.innerHTML="";

if(data.length===0){

container.innerHTML="<div class='loading'>Belum ada form aktif.</div>";
return;

}

data.forEach(form=>{

container.innerHTML+=`
<div class="card" onclick="openForm('${form.formId}')">

<div class="id">${form.formId}</div>

<div class="nama">${form.namaForm}</div>

<div class="info">
<span>📄 ${form.revisi}</span>
<span>🟢 ${form.status}</span>
</div>

</div>
`;

});

}catch(err){

container.innerHTML=`
<div class="error">
Gagal mengambil daftar form.
</div>
`;

}

}

function openForm(formId){

alert("Form dipilih: "+formId);

/* Langkah berikutnya kita buka checklist otomatis */

}

loadForms();

</script>

</body>
</html>
