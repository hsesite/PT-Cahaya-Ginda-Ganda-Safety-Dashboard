<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGG Safety Form Compiler</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071633;
color:white;
}

.header{
background:#E31E24;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:25px auto;
padding:20px;
}

.box{
background:#16284B;
border-radius:15px;
padding:25px;
margin-bottom:20px;
}

.dropzone{
border:2px dashed #4A7BC8;
border-radius:15px;
padding:40px;
text-align:center;
cursor:pointer;
transition:.2s;
}

.dropzone:hover{
background:#1D3561;
}

.dropzone input{
display:none;
}

.filename{
margin-top:15px;
font-size:14px;
color:#BFD3F2;
}

button{
width:100%;
padding:16px;
background:#E31E24;
border:none;
border-radius:12px;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#c9181d;
}

.preview{
background:#0B1A35;
border-radius:12px;
padding:20px;
min-height:220px;
color:#C8D7F2;
white-space:pre-wrap;
}

.footer{
text-align:center;
padding:25px;
color:#9CB4D8;
font-size:13px;
}
</style>
</head>

<body>

<div class="header">
CGG SAFETY FORM COMPILER
</div>

<div class="container">

<div class="box">

<h2>Upload Form Resmi</h2>

<p style="margin:12px 0 20px;color:#C8D7F2;">
Upload file DOCX atau PDF. Sistem akan mengubahnya menjadi template inspeksi.
</p>

<label class="dropzone">

<input type="file" id="fileInput" accept=".docx,.pdf">

<div style="font-size:50px;">📄</div>

<h3>Drag & Drop atau Klik di sini</h3>

<div class="filename" id="filename">
Belum ada file dipilih
</div>

</label>

<button id="compileBtn">
COMPILE FORM
</button>

</div>

<div class="box">

<h2>Preview</h2>

<div class="preview" id="preview">

Menunggu file di-compile...

</div>

</div>

</div>

<div class="footer">

CGG Safety Hub Compiler v1.0

</div>

<script src="https://cdn.jsdelivr.net/npm/mammoth/mammoth.browser.min.js"></script>
  
<script src="parser.js"></script>
<script src="renderer.js"></script>
<script src="exporter.js"></script>

</body>
</html>
